      schema:
        type: integer
    courseID:
      name: courseID
      in: query
      required: false
      description: Фильтр по курсу
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      required: false
      description: ''
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offset:
      name: offset
      in: query
      required: false
      description: ''
      schema:
        type: integer
        minimum: 0
        default: 0