  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: BAD_REQUEST
            message: Некорректный запрос
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHORIZED
            message: Не авторизован
    Forbidden:
      description: Нет прав на объект
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN
            message: Нет прав на объект
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: Объект не найден
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CONFLICT
            message: Конфликт состояния
    PayloadTooLarge:
      description: Слишком большой файл
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FILE_TOO_LARGE
            message: Слишком большой файл
    UnsupportedMediaType:
      description: Неподдерживаемый формат файла
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: Неподдерживаемый формат файла
    ValidationError:
      description: Ошибка проверки данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: Ошибка проверки данных
    TooManyRequests:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Превышен лимит запросов
  parameters:
    day:
