components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT, срок действия 15 минут
    refreshCookie:
      type: apiKey
      in: cookie
      name: mgimo_refresh
      description: Refresh JWT в HttpOnly Secure cookie, 7 суток. Без БД сессий отозвать уже выданный refresh JWT нельзя.
  schemas:
    StaffTeachingGroup:
      type: object
      required:
      - courseGroupID
      - courseID
      - title
      - groupID
      - groupNumber
      - semester
      - startsAt
      - endsAt
      - studentCount
      properties:
        courseGroupID:
          type: string
          format: uuid
        courseID:
          type: string
          format: uuid
        title:
          type: string
        groupID:
          type: integer
        groupNumber:
          type: integer
        semester:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        studentCount:
          type: integer
    StaffRosterRow:
      type: object
      required:
      - studentID
      - studentNumber
      - studentName
      - groupNumber
      - courseGraduate
      - score
      - credit
      - editable
      properties:
        studentID:
          type: string
          format: uuid
        studentNumber:
          type: integer
        studentName:
          type: string
        groupNumber:
          type: integer
        courseGraduate:
          type: string
          format: uuid
          nullable: true
        score:
          type: integer
          nullable: true
        credit:
          type: boolean
          nullable: true
        editable:
          type: boolean
    StaffDeanRequest:
      type: object
      required:
      - appoinmentID
      - appointmentTitle
      - appointmentDescription
      - appointmentStatus
      - created_at
      - studentName
      - studentNumber
      properties:
        appoinmentID:
          type: string
          format: uuid
        appointmentTitle:
          type: string
        appointmentDescription:
          type: string
        appointmentStatus:
          type: string
        created_at:
          type: string
          format: date-time
        studentName:
          type: string
        studentNumber:
          type: integer
    StaffFaculty:
      type: object
      required:
      - facultyID
      - title
      properties:
        facultyID:
          type: string
          format: uuid
        title:
          type: string
    StaffColleague:
      type: object
      required:
      - employerID
      - employerName
      properties:
        employerID:
          type: string
          format: uuid
        employerName:
          type: string
    StaffAccount:
      type: object
      required:
      - accountID
      - email
      - accountRole
      - isActive
      - createdAt
      - displayName
      properties:
        accountID:
          type: string
          format: uuid
        email:
