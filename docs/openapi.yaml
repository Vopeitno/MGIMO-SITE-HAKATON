openapi: 3.0.3
info:
  title: Цифровой деканат будущего — согласованный API
  version: 2.0.0
  description: Полный контракт демонстрационного цифрового деканата MGIMO. Схемы согласованы с MGIMO_Digital_Deanery_FINAL.dbml от 12.11.2026.
    Имена пользовательских колонок БД (включая appoinmentID и proccess) сохранены. Вход единый через accounts; публичной регистрации
    нет. Роли и доступ проверяются сервером по подтверждённой сессии. Пароли/хеши, паспортные данные и секреты никогда не возвращаются.
    Поля с пометкой x-derived получаются через JOIN/вычисление и не являются отдельными колонками БД. Обновления статусов, назначений
    и лимитов проводятся атомарно.
servers:
- url: /api/v1/MGIMO
  description: Путь API (хост задаётся при развёртывании)
tags:
- name: Авторизация и профиль
- name: Расписание
