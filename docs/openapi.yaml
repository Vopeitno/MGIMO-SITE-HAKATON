  /academic/transcript.pdf:
    get:
      tags:
      - Успеваемость
      summary: Скачать личную выписку об успеваемости в PDF
      operationId: academicTranscriptPDF
      description: >-
        Только STUDENT, только собственные данные по текущей группе из courseGroup.
        Идентификатор студента берётся из сессии. year задаёт номер года обучения (семестры 2*year-1 и 2*year) или all; без year выбирается текущий год по дате зачисления и границе 1 сентября МСК. Другие параметры и дубли запрещены.
        Согласованный снимок PostgreSQL: профиль, дисциплины, часы, семестры, баллы и зачёты.
        A4, встроенная кириллица, повтор заголовков и нумерация страниц.
        Учебный прототип, без печати и подписи университета. Другие форматы не поддерживаются.
      parameters:
      - name: year
        in: query
        description: Номер года обучения 1–50 или all. Без параметра — текущий год.
        schema:
          type: string
          pattern: '^(all|[1-9]|[1-4][0-9]|50)$'
      responses:
        '200':
          description: Персональная выписка, Cache-Control no-store
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename="academic-transcript.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Превышен лимит запросов или заняты два слота формирования PDF; повторить позже
        '500':
          description: Ошибка чтения или формирования PDF; частичный документ не выдаётся
      x-roles:
      - STUDENT
